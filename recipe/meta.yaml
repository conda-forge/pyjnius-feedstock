{% set version = "1.9.0" %}

{% if openjdk is undefined %}
{% set openjdk = "*" %}
{% endif %}

package:
  name: pyjnius
  version: {{ version }}

source:
  url: https://github.com/kivy/pyjnius/archive/{{ version }}.zip
  sha256: da8aad44c6deb33e8479a19cc98d9eca34e14fb98c3be0d7658b34b9c8dd748a

build:
  number: 0
  string: py{{ CONDA_PY }}jdk{{ openjdk|int or "latest" }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  {% if (openjdk|int or 99) == 11 %}
  # unclear but reproducible segfaults for the oldest possible combination on windows
  skip: true  # [win and py==310]
  {% endif %}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make                   # [unix]
    - sed                    # [unix]
  host:
    - openjdk
    - python
    - cython >=3.1.2
    - pip
    - setuptools
    - ant
  run:
    - openjdk
    - python
test:
  imports:
    - jnius
    - jnius.env
    - jnius_config
  requires:
    - pytest
  files:
    - test_pyjnius.py
  source_files:
    # created in source directory by ant (cf. build.sh / bld.bat)
    - build/test-classes
    - tests/
  commands:
    - python test_pyjnius.py
    # adapt CLASSPATH to pick up test classes
    - export CLASSPATH="$CLASSPATH:./build/test-classes"  # [unix]
    - set "CLASSPATH=%CLASSPATH%;build/test-classes"      # [win]
    - pytest -v tests/

about:
  home: https://github.com/kivy/pyjnius
  license: MIT
  license_file: LICENSE
  summary: A Python module to access Java classes as Python classes using JNI (shared memory)

extra:
  recipe-maintainers:
    - KeyWeeUsr
    - h-vetinari
